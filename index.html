<title>Transformer Plant Twin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the 3D plant fills the screen under a white top bar. Story card top-left, drawer tabs top-right,
   a details card bottom-left (transformer or facility), approval toasts bottom-right, slim timeline at the bottom.
   Deliberately one bright daylight look, like an operations wall screen. */
:root{
  color-scheme:light;
  --sky:#DCE7F1; --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --line:#E2E8F0; --card:#FFFFFF; --soft:#F1F5F9;
  --brand:#1F5F8B; --brand-2:#174A6C; --agent:#6D4FD8; --agent-soft:#EEEAFD;
  --risk:#E5484D; --risk-soft:#FDECEC; --warn:#D97706; --warn-soft:#FEF3C7; --ok:#15803D; --ok-soft:#DCFCE7;
  --shadow:0 10px 30px rgba(15,23,42,.14);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:13.5px;overflow:hidden}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{position:relative;height:100%}
.top{position:absolute;top:0;left:0;right:0;z-index:20;min-height:56px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.mid{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.clock{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.clock i{width:8px;height:8px;border-radius:50%;background:#94A3B8}
.clock.on i{background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
.seg button[data-m="agent"][aria-pressed="true"]{color:var(--agent)}
.right{display:flex;align-items:center;gap:10px}
.view{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);cursor:pointer}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--warn-soft);color:#92400E}
.stage{position:absolute;inset:0}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.ov{position:absolute;z-index:10}

.story{top:72px;left:max(16px,env(safe-area-inset-left,0px));width:min(500px,calc(100% - 32px));background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px 13px 18px;border-left:6px solid var(--ok)}
.story.warn{border-left-color:var(--warn)} .story.risk{border-left-color:var(--risk)} .story.agent{border-left-color:var(--agent)}
.story .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.story h2{margin:3px 0 4px;font-size:18px;line-height:1.3;text-wrap:balance}
.story.risk h2{color:var(--risk)} .story.warn h2{color:var(--warn)} .story.agent h2{color:var(--agent)} .story.ok h2{color:var(--ok)}
.story p{margin:0;color:var(--ink-2);line-height:1.5}
.nums{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.nums div b{display:block;font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.nums div small{color:var(--muted);font-size:12px}
.cmp{margin-top:10px;width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{padding:5px 8px;border-top:1px solid var(--line);text-align:left}
.cmp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cmp td.bad{color:var(--risk);font-weight:600} .cmp td.good{color:var(--ok);font-weight:600}

.rail{top:72px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-height:calc(100% - 170px)}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--risk);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.badge.agent{background:var(--agent)}
.drawer{width:min(370px,calc(100vw - 32px));background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:auto;min-height:0}
.drawer h3{margin:0;padding:12px 14px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.list{list-style:none;margin:0;padding:0}
.row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center}
.row:hover{background:var(--soft)} .row.sel{background:#EAF2F8}
.row b{font-family:var(--font-mono);font-weight:500}
.row .c{color:var(--muted);font-size:12px;grid-column:1/4}
.row .bar{grid-column:1/4;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--brand)}
.row .pc{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.risk{background:var(--risk-soft);color:var(--risk)} .tag.warn{background:var(--warn-soft);color:#92400E}
.msg{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.msg .t{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.msg .f{font-weight:600;margin-top:2px}
.msg .b{color:var(--ink-2);font-size:12.5px;margin-top:4px;line-height:1.5}
.msg .s{margin-top:6px;font-size:12px;font-weight:600;color:var(--warn)} .msg .s.read{color:var(--agent)}
.feed li{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.feed .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;align-self:start;margin-top:1px;white-space:nowrap}
.k.auto{background:var(--ok-soft);color:var(--ok)} .k.blocked{background:var(--risk-soft);color:var(--risk)} .k.ask{background:var(--warn-soft);color:#92400E} .k.read{background:var(--agent-soft);color:var(--agent)} .k.done{background:var(--ok-soft);color:var(--ok)} .k.no{background:var(--soft);color:var(--muted)}
.feed .tm{grid-column:2;color:var(--muted);font-size:11.5px}
.rules{padding:10px 14px 14px;display:grid;gap:10px}
.rules div b{display:block;font-size:12px;margin-bottom:3px}
.rules div span{color:var(--ink-2);font-size:12.5px;line-height:1.5}
.empty{padding:14px;color:var(--muted)}

.card{left:max(16px,env(safe-area-inset-left,0px));bottom:78px;width:min(640px,calc(100% - 32px));max-height:calc(100% - 330px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px 14px}
.card .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .h b{font-size:15px}
.card .h span{color:var(--muted)}
.card .x{margin-left:auto;border:0;background:var(--soft);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1}
.pbar{display:flex;align-items:center;gap:10px;margin-top:8px}
.pbar div{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pbar div i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pbar b{font-variant-numeric:tabular-nums;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:12px;position:relative}
.steps::before{content:"";position:absolute;left:8%;right:8%;top:9px;height:3px;border-radius:2px;background:var(--line)}
.step{text-align:center;position:relative;min-width:0}
.step i{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto 6px;background:var(--card);border:3px solid var(--line)}
.step.done i{background:var(--ok);border-color:var(--ok)}
.step.cur i{border-color:var(--brand);box-shadow:0 0 0 5px rgba(31,95,139,.15)}
.step.cur.risk i{border-color:var(--risk);box-shadow:0 0 0 5px rgba(229,72,77,.15)}
.step b{display:block;font-size:12px}
.step small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.cur.risk small{color:var(--risk);font-weight:600}
.tchart{margin-top:12px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:12px}
.tchart h5{grid-column:1/4;margin:0 0 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tchart .bt{height:12px;border-radius:3px;background:var(--brand)} .tchart .bt.wait{background:var(--warn)} .tchart .bt.cur{background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 4px,#5B8FB9 4px,#5B8FB9 8px)}
.tchart .v{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.info p{margin:6px 0 0;color:var(--ink-2);line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.facts div small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.facts div span{font-weight:600;font-size:13px}
.now{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--soft);display:grid;gap:4px}
.now b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.now span{font-size:13px}
.now span.risk{color:var(--risk);font-weight:600} .now span.ok{color:var(--ok);font-weight:600} .now span.warn{color:#92400E;font-weight:600}
.note{margin-top:8px;color:var(--muted);font-size:11.5px}

.time{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:8px 12px;flex-wrap:wrap}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:14px;height:14px;fill:currentColor}
.tnow{font-weight:600;width:200px;font-variant-numeric:tabular-nums;flex:none}
.track{flex:1;min-width:200px;position:relative;padding-top:14px}
.track input{width:100%;accent-color:var(--brand);margin:0}
.pins{position:absolute;left:0;right:0;top:0;height:12px}
.pins button{position:absolute;top:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);transform:translateX(-6px);cursor:pointer;padding:0}
.speed{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);cursor:pointer;flex:none}

.autos{right:max(16px,env(safe-area-inset-right,0px));bottom:78px;width:min(390px,calc(100% - 32px));display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.autos.up{bottom:330px}
.auto{pointer-events:auto;cursor:pointer;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;border-left:5px solid var(--ok);animation:pop .35s ease-out}
.auto.blocked{border-left-color:var(--risk)} .auto.read{border-left-color:var(--agent)}
.auto .h2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.auto.blocked .h2{color:var(--risk)} .auto.read .h2{color:var(--agent)}
.auto .tx{margin-top:3px;line-height:1.45}
.auto .rl{margin-top:5px;font-size:12px;color:var(--muted)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast{right:max(16px,env(safe-area-inset-right,0px));bottom:78px;width:min(390px,calc(100% - 32px));background:#1F2329;color:#F3F4F6;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:14px 16px;border-top:3px solid var(--agent)}
.toast .a{display:flex;align-items:center;gap:8px;font-size:12px;color:#C7CBD1}
.toast .a i{width:16px;height:16px;border-radius:4px;background:var(--agent);display:inline-block}
.toast .a em{margin-left:auto;font-style:normal;color:#A5ACB8}
.toast h4{margin:8px 0 4px;font-size:15px}
.toast p{margin:0;color:#D1D5DB;line-height:1.5;font-size:13px}
.toast blockquote{margin:8px 0 0;padding:8px 10px;border-left:3px solid #6D4FD8;background:#2A2F36;color:#E5E7EB;font-size:12.5px;line-height:1.5}
.toast .btns{display:flex;gap:8px;margin-top:12px}
.toast .btns button{flex:1;border:0;border-radius:6px;padding:8px;cursor:pointer;font-weight:600}
.toast .yes{background:var(--agent);color:#fff} .toast .no{background:#3A3F47;color:#E5E7EB}

.chip{font-size:12px;font-weight:600;background:var(--card);border-radius:999px;padding:3px 9px 3px 7px;display:flex;gap:6px;align-items:center;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.18);color:var(--ink)}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.risk{background:var(--risk);color:#fff} .chip.risk .d{background:#fff}
.chip.warn .d{background:var(--warn)} .chip.idle .d{background:#94A3B8}
.chip.good{background:var(--ok);color:#fff} .chip.good .d{background:#fff}
.chip.sel{outline:3px solid rgba(31,95,139,.35)}
.chip .x{font-weight:500}
.chip.small{padding:2px 7px 2px 6px;font-size:10.5px;box-shadow:none;background:rgba(255,255,255,.88)}
.callout{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--card);box-shadow:0 4px 14px rgba(15,23,42,.2);white-space:nowrap;border-left:4px solid var(--muted);color:var(--ink)}
.callout.risk{border-left-color:var(--risk);color:var(--risk)} .callout.warn{border-left-color:var(--warn);color:#92400E}
.callout.ok{border-left-color:var(--ok);color:var(--ok)} .callout.agent{border-left-color:var(--agent);color:var(--agent)}
.callout.block{background:var(--risk);color:#fff;border-left-color:#7F1D1D;font-size:13px;padding:8px 12px}
.bl{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--brand);padding:3px 10px;border-radius:6px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.bl:hover,.fl:hover{filter:brightness(1.15);text-decoration:underline}
.bl.minor{background:#475569;font-size:13px}
.fl{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-2);white-space:nowrap;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:4px;pointer-events:auto;cursor:pointer}
.tourbtn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}
.tour{top:72px;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 32px));background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;border-top:5px solid var(--brand);z-index:15}
.tour .st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tour h3{margin:4px 0 6px;font-size:19px;text-wrap:balance}
.tour p{margin:0;color:var(--ink-2);line-height:1.55}
.tour{left:max(16px,env(safe-area-inset-left,0px));transform:none;width:min(440px,calc(100% - 32px))}
.tour .going{color:var(--muted);font-style:italic}
.hovertip{position:fixed;z-index:30;pointer-events:none;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;max-width:280px;font-size:12.5px;line-height:1.45;border-left:4px solid var(--brand)}
.hovertip b{display:block;font-size:13.5px}
.hovertip span{display:block;color:var(--ink-2)}
.hovertip span.risk{color:var(--risk);font-weight:600} .hovertip span.warn{color:#92400E;font-weight:600} .hovertip span.ok{color:var(--ok)}
.hovertip i{display:block;font-style:normal;color:var(--muted);font-size:11.5px;margin-top:3px}
.tourtag{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#B45309;padding:4px 12px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px rgba(15,23,42,.3)}
.trace{margin-top:10px;background:#0F172A;color:#CBD5E1;border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;line-height:1.6;min-height:24px}
.trace:empty{display:none}
.trace .tl{display:flex;gap:8px;animation:pop .3s ease-out}
.trace .tl::before{content:"›";color:#A78BFA}
.trace .hd{color:#A78BFA;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trace .cur::after{content:"▍";color:#A78BFA;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tour .cmp{margin-top:4px;color:#E2E8F0}.tour .cmp th{color:#94A3B8}.tour .cmp td.good{color:#4ADE80}.tour .cmp td.bad{color:#F87171}
.tour .ctl{display:flex;align-items:center;gap:8px;margin-top:12px}
.tour .dots{display:flex;gap:5px;flex:1}
.tour .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .tour .dots i.on{background:var(--brand)}
.tour button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.tour button.next{background:var(--brand);border-color:var(--brand);color:#fff}
.tour button:disabled{opacity:.45;cursor:not-allowed}
.touring.showcard .card{display:block!important}
.touring .story,.touring .rail,.touring .card,.touring .autos,.touring .time{display:none}
.focus .chip:not([data-hl]){opacity:.35}
.focus .callout:not([data-hl]),.focus .fl{display:none}
.focus .bl{opacity:.55}
.focus.showbl .bl{display:block}
.focus .chip[data-hl],.focus .callout[data-hl]{font-size:15px;padding:7px 14px;box-shadow:0 0 0 4px rgba(245,158,11,.55),0 6px 18px rgba(15,23,42,.25)}
.far .fl,.far .bl.minor{display:none}
@media (max-width:760px){.story{top:auto;bottom:150px}.card{bottom:150px}.rail{top:118px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Transformer Plant Twin</h1><span>Power transformer works · 9–25 Nov 2026</span></div>
    <div class="mid">
      <span class="clock" id="clock"><i></i><span id="clockT">Wed 11 Nov 10:30</span></span>
      <div class="seg" role="group" aria-label="Run mode">
        <button data-m="base" aria-pressed="true">Today, no agent</button>
        <button data-m="agent" aria-pressed="false">With AI agent</button>
      </div>
    </div>
    <div class="right"><button class="tourbtn" id="tourBtn">▶ Play demo</button><select id="view" class="view" aria-label="Camera view"></select><span class="pill">Synthetic data</span></div>
  </header>
  <main class="stage" id="stage"></main>
  <div class="labels" id="labels"></div>
  <div class="hovertip" id="hovertip" hidden></div>

function pct(u,t){
  const segs=actualSegs(u);if(isShipped(u,t))return 100;
  const first=ORDER.indexOf(segs[0][0]);let p=0;for(let i=0;i<first;i++)p+=WT[ORDER[i]];
  for(const[k, ,s,e]of segs){if(!(k in WT))continue;if(t>=e)p+=WT[k];else if(t>s)p+=WT[k]*(t-s)/(e-s)}
  if(t<segs[0][2])p=first?p:0;
  return Math.min(99,Math.round(p*100));
}
function status(u,t){
  const loc=locate(actualSegs(u),t);
  if(loc.phase==='before')return{key:'before',label:'Not started',cls:'idle'};
  if(isShipped(u,t))return{key:'shipped',label:'Shipped',cls:'idle'};
  const k=loc.seg[0],ld=lateDays(u,t);
  const recovered=u.id==='T-07'&&agentOn()&&decided('t07',t)==='approve';
  let label=STAGE[k];if(u.small&&k==='hold')return{key:k,label:'Queued',late:0,cls:'ok'};if(u.id==='T-11'&&wm4Broken(t))label='Machine broken';if(u.id==='T-15'&&k==='hold')label='Waiting for oil';
  const stuck=(u.id==='T-11'&&wm4Broken(t))||(u.id==='T-15'&&k==='hold');
  return{key:k,label,late:ld,cls:ld?(recovered?'warn':'risk'):(k==='hold'||stuck?'warn':'ok'),recovered,stuck};
}

function busyLines(ids,t,moist){return ids.map(id=>{const u=UNITS.find(u=>{const s=actualSegs(u).find(x=>x[1]===id);return s&&t>=s[2]&&t<s[3]});
  if(id==='WM-4'&&wm4Broken(t))return[`${id}: broken down, repair under way`,'risk'];
  if(!u)return[`${id}: free`,''];const s=actualSegs(u).find(x=>x[1]===id);
  let extra='';if(moist){const k=(t-s[2])/(s[3]-s[2]);extra=` · moisture ${(.4+2.6*Math.exp(-4*k)).toFixed(1)}%`}
  return[`${id}: ${u.id} until ${fmtD(s[3])}${extra}${id==='WM-4'&&wm4Slow(t)?' · running slow':''}`,id==='WM-4'&&wm4Slow(t)?'warn':'']})}

function updateWorld(t,dt,playing){
  const occ={};
  for(const u of UNITS){
    const o=U[u.id],segs=actualSegs(u),loc=locate(segs,t);let vis=true,pos=null,show='active',moving=false;
    if(loc.phase==='before')vis=false;
    else if(loc.phase==='after'){const l=segs.at(-1);if(l[0]==='yard'){const kk=(t-l[3])/4;if(kk>1)vis=false;else{const y=RES[l[1]];pos=pathPos([[y.x,y.z],[y.x,48],[50,48],[50,-32],[96,-32],[96,-55]],ease(kk),1.1);show='yard'}}else{pos=resPos(loc.seg[1]);show=loc.seg[0]}}
    else{const seg=loc.seg;pos=resPos(seg[1]);show=seg[0];
      if(loc.phase==='in'){occ[seg[1]]=u;const D=Math.min(4,(seg[3]-seg[2])*.4);

$('view').onchange=e=>flyTo(e.target.value);
function select(s,focus){sel=s;if(s&&s.unit&&focus){const o=U[s.unit];if(o.g.visible){const p=o.g.position.clone();p.y=0;if(reduce)controls.target.copy(p);else{fly=null;camGoal=p}}}refresh(true)}
function showInfo(id,focus){select({info:id},false)}
function setT(h){T=Math.max(0,Math.min(H_END,h));scrub.value=T;refresh(true)}
scrub.oninput=()=>{T=+scrub.value;refresh(true)};
$('speed').onchange=e=>speed=+e.target.value;
function syncPlay(){$('playIcon').innerHTML=playing?'<path d="M3 2h4v12H3zM9 2h4v12H9z"/>':'<path d="M3 2l11 6-11 6z"/>';$('play').setAttribute('aria-label',playing?'Pause':'Play')}
$('play').onclick=()=>{if(!playing&&T>=H_END)T=0;playing=!playing;syncPlay();refresh(true)};
let PRESET=[];
function setMode(md,auto){MODE=md;DS={};PRESET=[];lastToast='';document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===md)));
  if(auto&&agentOn()){T=EV_SUPPLIER-.05;scrub.value=T;playing=true;syncPlay();drawer='agent';sel={unit:'T-07'};flyTo('overview')}else if(!agentOn()&&drawer==='agent')drawer=null;
  buildPins();refresh(true)}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{endTour();setMode(b.dataset.m,true)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{drawer=drawer===b.dataset.d?null:b.dataset.d;refresh(true)});
function decide(choice){const p=pending(T);if(!p)return;if(tourI>=0){DS[p.id]=choice;lastToast='';refresh(true);setTimeout(()=>{if(tourI>=0&&TOUR[tourI].wait)showStep(tourI+1)},700);return}DS[p.id]=choice;T=Math.max(T,decideAt(p.id));scrub.value=T;playing=true;syncPlay();buildPins();
  if(p.id==='wm4')select({info:'clean'});else if(p.id==='oil')select({info:'oil'});else select({unit:'T-07'},true)}
$('approve').onclick=()=>decide('approve');$('reject').onclick=()=>decide('reject');

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
const setPtr=e=>{const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera)};
const visPicks=()=>pickables.filter(o=>{let p=o;while(p){if(!p.visible)return false;p=p.parent}return true});
function hitOf(){const hs=ray.intersectObjects(visPicks(),false);return hs.find(h=>h.object.userData.pick.unit)||hs[0]}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];fly=null});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;setPtr(e);const h=hitOf();select(h?h.object.userData.pick:null,!!(h&&h.object.userData.pick.unit))});
/* Hover: highlight the part and show a two-line live summary next to the cursor */
const hoverBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:'#38BDF8',transparent:true,opacity:.18,depthWrite:false}));
hoverBox.matrixAutoUpdate=false;hoverBox.visible=false;scene.add(hoverBox);
const hoverEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:'#0EA5E9'}));
hoverEdge.matrixAutoUpdate=false;hoverEdge.visible=false;scene.add(hoverEdge);
function hoverSummary(d){
  if(d.unit){const u=UNITS.find(x=>x.id===d.unit),st=status(u,T);
    return{n:`${u.id} · ${u.cust}`,lines:[[`${pct(u,T)}% built · ${st.label}`,''],st.late?[`${st.late} days late`,'risk']:[`Promised ${fmtD(u.planned)}`,'']]}}
  const I=INFO[d.info],live=I.live(T);let lines;
  if(live.length>2){const busy=live.filter(l=>!/free/.test(l[0])).length;const bad=live.find(l=>l[1]==='risk'||l[1]==='warn');
    lines=[[`${busy} of ${live.length} in use`,''],bad||[busy===live.length?'Fully booked: possible bottleneck':'Running normally',busy===live.length?'warn':'ok']]}
  else lines=live.length?live:[[`${I.f[0][0]}: ${I.f[0][1]}`,'']];
  return{n:I.n,lines}}
let hoverKey='';
function setHover(h,e){const tip=$('hovertip');
  if(!h||tourI>=0){hoverBox.visible=hoverEdge.visible=false;tip.hidden=true;hoverKey='';return}
  const o=h.object;o.updateWorldMatrix(true,false);
  for(const m of[hoverBox,hoverEdge]){m.matrix.copy(o.matrixWorld);m.matrix.scale(new THREE.Vector3(o.geometry.parameters.width*1.04,o.geometry.parameters.height*1.04,o.geometry.parameters.depth*1.04));m.visible=true}
  const sm=hoverSummary(o.userData.pick);const key=sm.n+JSON.stringify(sm.lines);
  if(key!==hoverKey){tip.innerHTML=`<b></b>${sm.lines.map(l=>`<span class="${l[1]}"></span>`).join('')}<i>Click for details</i>`;tip.querySelector('b').textContent=sm.n;tip.querySelectorAll('span').forEach((x,k)=>x.textContent=sm.lines[k][0]);hoverKey=key}
  tip.hidden=false;tip.style.left=Math.min(innerWidth-300,e.clientX+16)+'px';tip.style.top=Math.max(64,e.clientY-10)+'px'}
renderer.domElement.addEventListener('pointermove',e=>{setPtr(e);const h=hitOf();renderer.domElement.style.cursor=h?'pointer':'grab';setHover(h,e)});
renderer.domElement.addEventListener('pointerleave',()=>setHover(null));
function resize(){const w=host.clientWidth||innerWidth,h=host.clientHeight||innerHeight;renderer.setSize(w,h);labelR.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host);resize();

/* Agent actions taken on its own appear as short notifications, each citing the rule that allowed it */
let lastAutoT=0;
function showAuto(a){const H={auto:'✓ Done by the agent · no approval needed',read:'✓ Read by the agent',blocked:'⛔ Blocked by policy'};
  const e=el('auto '+a.k,`<div class="h2">${H[a.k]}</div><div class="tx"></div><div class="rl"></div>`);e.querySelector('.tx').textContent=a.text;e.querySelector('.rl').textContent='Rule: '+a.rule;
  if(a.go)e.onclick=()=>flyTo(a.go);const box=$('autos');box.prepend(e);while(box.children.length>3)box.lastChild.remove();setTimeout(()=>e.remove(),7000)}
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.1);
  if(playing){
    let s=speed;if(agentOn()&&T>=EV_SUPPLIER-.1&&T<57.7)s=Math.min(s,.05);if(tourI>=0&&tourSpeed)s=tourSpeed;
    const nextAsk=agentOn()?DEC.find(d=>!DS[d.id]):null;
    T+=s*dt;
    if(nextAsk&&T>=nextAsk.at){T=nextAsk.at;playing=false;syncPlay();if(nextAsk.id==='oil')select({info:'oil'});else if(nextAsk.id==='wm4')select({info:'clean'})}
    if(tourI>=0&&tourStop!=null&&T>=tourStop){T=tourStop;playing=false;tourStop=null;syncPlay()}
    if(T>=H_END){T=H_END;playing=false;syncPlay()}
    scrub.value=T;
  }
  if(agentOn()&&T>lastAutoT&&T-lastAutoT<3)for(const a of AUTO)if(a.at>lastAutoT&&a.at<=T)showAuto(a);
  lastAutoT=T;
  if(fly){fly.k=Math.min(1,fly.k+dt/(fly.dur||1.1));const e=ease(fly.k);camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(fly.k>=1){const cb=fly.cb;fly=null;if(cb)cb()}}
  if(camGoal){controls.target.lerp(camGoal,.08);if(controls.target.distanceTo(camGoal)<.2)camGoal=null}
  controls.update();labelHost.classList.toggle('far',camera.position.distanceTo(controls.target)>150);
  updateWorld(T,dt,playing);refresh(false);renderer.render(scene,camera);labelR.render(scene,camera);requestAnimationFrame(frame);
}
/* ================= Guided demo: one thing per step ================= */
const focusMat=new THREE.MeshBasicMaterial({color:'#F59E0B',transparent:true,opacity:.8,side:THREE.DoubleSide,depthTest:false});
const focusRing=new THREE.Mesh(new THREE.RingGeometry(4.6,5.6,64),focusMat);focusRing.rotation.x=-Math.PI/2;focusRing.renderOrder=5;focusRing.visible=false;scene.add(focusRing);
function setFocus(pos,els,showBuildings){
  document.querySelectorAll('[data-hl]').forEach(e=>delete e.dataset.hl);
  for(const e of els||[])e.dataset.hl='1';
  labelHost.classList.add('focus');labelHost.classList.toggle('showbl',!!showBuildings);
  focusRing.visible=!!pos;if(pos)focusRing.position.set(pos[0],.35,pos[1]);
}
function flyPT(p,t){if(reduce){camera.position.set(...p);controls.target.set(...t);return}camGoal=null;fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),k:0}}
function at07(){return[RES.H1.x,RES.H1.z]}
function jump(h){playing=false;syncPlay();T=h;lastAutoT=h;scrub.value=T;refresh(true)}
let tourStop=null,tourSpeed=0;
function run(from,to,sp){T=from;lastAutoT=from;scrub.value=T;tourStop=to;tourSpeed=sp;playing=true;syncPlay();refresh(true)}
const wmPos=()=>[RES['WM-4'].x,RES['WM-4'].z];
const TOUR=[
 {t:'A transformer works with 25 orders in flight',p:'For one of our (synthetic) clients, we connected an AI agent to their plant.',
  focus:null,area:'',hl:()=>[],run:[28,50,7],
  trace:['Watches: schedule, 41 machines, inbox, shift logs','Follows a policy: what it may do alone, what needs a person']},
 {t:'Every part of the plant has live details',p:'Click any building or machine to see its capacity, cycle time and what it is working on right now.',
  focus:[23,17.5],area:'Drying ovens',hl:()=>[],run:[50,53.8,.9],card:'ovens',trace:[]},
 {t:'06:12 · Machine 4 is running slow',p:'Winding machine 4 is running slow. Nobody reported it.',wait:'wm4',
  focus:wmPos(),area:'Coil winding room · machine 4',hl:()=>[calls.WM4.e,U['T-11'].chip],run:[53.8,54.2,.12],
  trace:['Machine 4 running 38% slower since 02:00','Same pattern came before 3 past breakdowns','Taking a machine offline needs a person → asking']},
 {t:'09:10 · A 4-day backlog appears on T-07',p:'Order T-07 will ship 4 days late.',
  focus:at07(),area:'Hold area · T-07',hl:()=>[U['T-07'].chip],run:[57.12,57.26,.05],
  trace:['T-07 forecast 23 Nov, promised 19 Nov','Penalty: ₹25 L a day × 4 = ₹1 Cr']},
 {t:'Why? Its parts are stuck at customs',p:'Found in an unread supplier email. Chasing a supplier needs no approval, so it does it: parts now arrive 16 Nov.',
  focus:[-66,1.4],area:'Stores · bushing shelf',hl:()=>[calls.BUSH.e],run:[57.26,57.31,.025],
  trace:['Supplier email: "held at Chennai customs, ETA 18th"','Rule: chasing a supplier → allowed alone','Backlog down from 4 days to 3']},
 {t:'It weighs the options, and rules one out',p:'Skipping a test is never allowed.',
  focus:[-36,49],area:'High-voltage test lab',hl:()=>[calls.BLOCK.e],run:[57.37,57.372,.02],
  trace:['Skip the final test: −1 day → ⛔ never allowed','Night shift in test lab: −2 days, ₹6 L → ask a person']},
 {t:'It asks the plant head to decide',p:'Answer the notification in the bottom-right corner.',wait:'t07',
  focus:at07(),area:'Hold area · T-07',hl:()=>[U['T-07'].chip],run:[57.39,57.40,.05],
  trace:['Spend ₹6 L to avoid ₹75 L of penalty','Overtime above ₹2 L → needs a person']},
 {t:'Two days later · it spots oil running short',p:'It flagged it to purchasing early, so the order went in on time.',
  focus:[70,24],area:'Oil storage',hl:()=>[calls.OIL.e,U['T-15'].chip],run:[98,106,1.5],
  trace:['210 kL in stock, next fillings need 300 kL','Empty by 21 Nov → T-15 would be stuck','Purchase above ₹50 L → sent to purchasing']},
 {t:'Two weeks later · what changed',p:'Same plant, same problems. With the agent and your 2 approvals:',table:true,
  focus:null,area:'',hl:()=>[],run:[110,H_END,30],trace:[]},
];
/* Camera: out to the whole plant, hold, then in to the part. Wide, high angle, framed right of the card. */
const tourTag=label(el('tourtag',''),0,0,0);tourTag.visible=false;
function closeView([x,z]){return{p:[x-6,62,z+52],t:[x-14,0,z+4]}}
function flyGo(p,t,dur,cb){fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),k:0,dur,cb};camGoal=null;if(reduce){fly.k=1}}
function tourCam(step,cb){const O=VIEWS.overview;
  flyGo(O.p,O.t,1,()=>setTimeout(()=>{if(TOUR[tourI]!==step)return;if(!step.focus){cb();return}const v=closeView(step.focus);flyGo(v.p,v.t,1.1,cb)},900))}
let traceTok=0;
function typeTrace(lines){const box=$('tourTrace');box.innerHTML='';const tok=++traceTok;if(!lines.length)return;
  box.innerHTML='<div class="hd">Agent reasoning</div>';let i=0;
  const add=()=>{if(tok!==traceTok||i>=lines.length)return;box.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));
    const d=document.createElement('div');d.className='tl cur';d.textContent=lines[i++];box.appendChild(d);setTimeout(add,reduce?0:650)};add()}
let tourI=-1;
function showStep(i){tourI=i;const s=TOUR[i];
  if(i===0||!agentOn()){setMode('agent');DS={mail:'approve',oil:'approve'};PRESET=['mail','oil'];lastToast='';buildPins()}
  if(s.wait){delete DS[s.wait];lastToast=''}
  sel=null;drawer=null;document.querySelector('.app').classList.remove('showcard');$('autos').innerHTML='';traceTok++;$('tourTrace').innerHTML='';
  document.querySelector('.app').classList.add('touring');$('tour').hidden=false;
  jump(s.run[0]);setFocus(null,[],true);tourTag.visible=false;
  $('tourStep').textContent=`Demo · ${i+1} of ${TOUR.length}`;
  $('tourT').textContent=s.area?`Going to: ${s.area}`:s.t;$('tourT').className=s.area?'going':'';$('tourP').textContent='';
  $('tourDots').innerHTML=TOUR.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
  $('tourBack').disabled=i===0;$('tourNext').textContent=i===TOUR.length-1?'Finish':'Next';tourTick();
  tourCam(s,()=>{if(tourI!==i)return;
    $('tourT').className='';$('tourT').textContent=s.t;$('tourP').textContent=s.p;
    setFocus(s.focus,s.hl(),!s.focus);
    if(s.focus){tourTag.element.textContent=s.area;tourTag.position.set(s.focus[0],9,s.focus[1]);tourTag.visible=true}
    if(s.card){sel={info:s.card};document.querySelector('.app').classList.add('showcard');refresh(true);
      setTimeout(()=>{if(tourI!==i)return;sel=null;document.querySelector('.app').classList.remove('showcard');refresh(true)},5000)}
    if(s.table)$('tourTrace').innerHTML='<div class="hd">Result</div>'+cmpTable();else typeTrace(s.trace);
    run(...s.run)})}
function tourTick(){if(tourI<0)return;const s=TOUR[tourI];if(s.wait&&!DS[s.wait]){$('tourHint').textContent='Waiting for your decision';$('tourNext').disabled=true}else{$('tourHint').textContent='';$('tourNext').disabled=false}
  if(focusRing.visible){const k=1+.12*Math.sin(performance.now()/250);focusRing.scale.set(k,k,k)}}
function endTour(){if(tourI<0)return;tourI=-1;$('tour').hidden=true;document.querySelector('.app').classList.remove('touring','showcard');
  labelHost.classList.remove('focus','showbl');focusRing.visible=false;tourTag.visible=false;fly=null;tourStop=null;tourSpeed=0;traceTok++;document.querySelectorAll('[data-hl]').forEach(e=>delete e.dataset.hl);refresh(true)}
$('tourBtn').onclick=()=>showStep(0);
$('reset').onclick=()=>{endTour();playing=false;syncPlay();setMode('base');$('autos').innerHTML='';lastAutoT=0;sel=null;drawer=null;setT(0);flyTo('overview')};
$('tourNext').onclick=()=>{if(tourI<TOUR.length-1)showStep(tourI+1);else endTour()};
$('tourBack').onclick=()=>{if(tourI>0)showStep(tourI-1)};
$('tourExit').onclick=endTour;
setInterval(tourTick,60);
buildPins();refresh(true);frame();
</script>
